name = "hanhphucventoan"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static landing page + images. API routes run the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 database created in the Cloudflare dashboard
[[d1_databases]]
binding = "DB"
database_name = "hiilee-gift"
database_id = "3ab5d10d-0153-4bb6-8ec9-6bbe3db2258c"

[vars]
UNIT_PRICE = "389000"
REFERRAL_DISCOUNT = "20000"
MAX_QUANTITY = "50"
ORDER_DEADLINE = "2026-10-15T23:59:59+07:00"
TRANSFER_PREFIX = "HIILEE"

# Referral codes: add rows to the referral_codes table, and/or list them here (comma-separated).
# Not case-sensitive: "kimbao", "KimBao" and "KIMBAO" all work.
REFERRAL_CODES = "HanhNhan,YenDieu,KhanhLy,Sunshine,LeNhon,KimBao,TuyetNgan,TrangLe,ThuHoai,ThanhVan,MinhThao,ThuyTrang,ThuanThao,DoanVien,MinhThu,MinhKy,PhuongThao,DuyDuc,MinhAnh,ThanhThao,MinhChau,NguyenAnh,VuNgoc,MongThuy,VuVy,HoaiNam,KimChi,KimThu,MyLinh,HangNguyen,YenHoang,MinhNguyet,DongThinh,PhuongTuyen,TheHung,BachMai,KhanhHa"
# "true" = accept ANY non-empty code (same as the mockup). Keep "false" in production.
ACCEPT_ANY_REFERRAL = "false"

# Payment: the company's own Techcombank QR is shown after each order.
# The bank details below are printed under the QR so customers can also transfer manually.
STATIC_QR_URL = "/img/bank-qr.jpg"              # 389.000đ — full price
STATIC_QR_URL_REFERRAL = "/img/bank-qr-2.jpg"   # 369.000đ — shown when a referral code is applied
BANK_NAME = "Techcombank"
BANK_ACCOUNT_NO = "1903 6328 0240 18"
BANK_ACCOUNT_NAME = "CONG TY CO PHAN THUONG HIEU VAN HOA SELF HIIL"
# Optional: to pre-fill the amount + transfer note in the QR instead, clear STATIC_QR_URL
# and set BANK_ID = "tcb" (VietQR), with BANK_ACCOUNT_NO written without spaces.
BANK_ID = ""
VIETQR_TEMPLATE = "compact2"

# Order tracking emails (sent when an order is marked "paid" in /admin)
SITE_URL = "https://hanhphucventoan.com"
MAIL_FROM = "Self Hiil <donhang@hanhphucventoan.com>"   # domain must be verified in Resend
MAIL_REPLY_TO = "hiila@selfhiil.com"
MAIL_BCC = ""                                           # optional: copy every email to this address

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   ADMIN_TOKEN          required for /admin and /api/admin/*
#   RESEND_API_KEY       required to email tracking codes (https://resend.com → API Keys)
#   NOTIFY_WEBHOOK_URL   optional — receives a JSON POST for every new order
